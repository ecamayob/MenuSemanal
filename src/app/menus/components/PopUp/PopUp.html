@if (modal.isOpen) {
  <!-- Overlay / Fondo Oscuro -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity p-4">

    <!-- Modal Card -->
    <div class="w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-2xl transition-all">

      <!-- Header: Ícono + Título -->
      <div class="flex items-center gap-4">

        <!-- Contenedor del Ícono (Color dinámico según el tipo) -->
        <div
          class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full"
          [ngClass]="{
            'bg-emerald-100 text-emerald-600': modal.type === 'success',
            'bg-amber-100 text-amber-600': modal.type === 'warning',
            'bg-rose-100 text-rose-600': modal.type === 'error',
            'bg-blue-100 text-blue-600': modal.type === 'info'
          }"
        >
          <!-- Ícono SVG según tipo -->
          @switch (modal.type) {
            @case ('success') {
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            }
            @case ('warning') {
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
              </svg>
            }
            @case ('error') {
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            }
            @default {
              <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
              </svg>
            }
          }
        </div>

        <!-- Título -->
        <h3 class="text-xl font-bold text-slate-900">
          {{ modal.title }}
        </h3>
      </div>

      <!-- Mensaje -->
      <div class="mt-4 pl-18">
        <p class="text-sm text-slate-600 leading-relaxed">
          {{ modal.message }}
        </p>
      </div>

      <!-- Acciones (Botones) -->
      <div class="mt-6 flex justify-end gap-3">
        @if (modal.showCancel) {
          <button
            type="button"
            (click)="dialogService.cancel()"
            class="rounded-xl bg-slate-100 px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-200 active:scale-95"
          >
            Cancelar
          </button>
        }

        <!-- Botón Aceptar (Cambia de color dinámicamente) -->
        <button
          type="button"
          (click)="dialogService.confirm()"
          class="rounded-xl px-5 py-2.5 text-sm font-semibold text-white shadow-md transition active:scale-95"
          [ngClass]="{
            'bg-emerald-600 hover:bg-emerald-700': modal.type === 'success',
            'bg-red-600 hover:bg-red-700': modal.type === 'warning' || modal.type === 'error',
            'bg-blue-600 hover:bg-blue-700': modal.type === 'info'
          }"
        >
          Aceptar
        </button>
      </div>

    </div>
  </div>
}
