@if (dialogService.isOpen()) {
      <!-- Fondo oscuro con efecto blur y transición suave -->
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity animate-fade-in"
        (click)="dialogService.cancelAction()"
      >
        <!-- Tarjeta del Modal -->
        <div
          class="relative w-full max-w-md p-6 bg-white rounded-2xl shadow-2xl transform transition-all animate-scale-in dark:bg-slate-800 dark:border dark:border-slate-700"
          (click)="$event.stopPropagation()"
        >
          <!-- Encabezado e Icono de advertencia -->
          <div class="flex items-center gap-4 mb-4">
            <div class="flex items-center justify-center w-12 h-12 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">
                {{ dialogService.options().title }}
              </h3>
            </div>
          </div>

          <!-- Mensaje / Contenido -->
          <p class="text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed">
            {{ dialogService.options().message }}
          </p>

          <!-- Botones de Acción -->
          <div class="flex items-center justify-end gap-3">
            <button
              type="button"
              class="px-4 py-2 text-sm font-semibold text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-300 transition-colors dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600"
              (click)="dialogService.cancelAction()"
            >
              {{ dialogService.options().cancelText }}
            </button>

            <button
              type="button"
              class="px-4 py-2 text-sm font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500/50 shadow-md shadow-red-500/20 transition-all dark:bg-red-500 dark:hover:bg-red-600"
              (click)="dialogService.confirmAction()"
            >
              {{ dialogService.options().confirmText }}
            </button>
          </div>
        </div>
      </div>
    }
