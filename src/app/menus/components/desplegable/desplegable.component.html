
 <div class="mt-3 sm:mt-4 space-y-2">
      <!-- Input de búsqueda -->
      <div class="relative flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 h-4 w-4 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          type="text"
          placeholder=""
          [value]="busqueda()"
          (input)="actualizarBusqueda($any($event.target).value)"
          class="w-full rounded-xl border border-slate-200 bg-slate-50/50 py-2.5 pl-10 pr-4 text-sm text-slate-800 outline-none focus:border-blue-300 focus:bg-white"
        />
      </div>

      <!-- Lista Dropdown -->
      <ul class="max-h-60 overflow-y-auto divide-y divide-slate-100 rounded-xl border border-slate-200 bg-white text-sm shadow-sm">
        @for (plato of platosFiltrados(); track plato.id) {
          <li
            (click)="elegirPlato(plato)"
            [class.cursor-not-allowed]="plato.usado"
            [class.bg-slate-50]="!plato.usado"
            class="flex items-center justify-between px-3.5 sm:px-4 py-3 text-slate-800 active:bg-slate-200 transition-colors hover:bg-slate-100/70">

            <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 pr-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
              <span [class.font-semibold]="!plato.usado" [class.text-slate-400]="plato.usado" class="truncate">
                {{ plato.nombre }}
              </span>
            </div>

            @if (plato.usado) {
              <span class="shrink-0 text-xs text-slate-400">Ya usado</span>
            }
          </li>
        }
      </ul>
    </div>
