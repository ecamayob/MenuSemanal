<div class="w-full max-w-xl rounded-2xl border border-blue-400 bg-white p-4 sm:p-5 shadow-sm transition-all">
  <h3 class="mb-3 sm:mb-4 text-base font-bold text-slate-900">{{dia()}}</h3>

  <!-- Fila de platillos: 1 columna en móvil, 2 columnas desde pantallas 'sm' -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">

    <!-- Columna 1: ENTRADA -->
     <div>
      @if (entradaSeleccionada()) {
      <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-amber-100/80 text-amber-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414M16.95 16.95l1.414 1.414M7.05 7.05L5.636 5.636" />
            </svg>
          </div>
          <div class="min-w-0">
            <span class="block text-[10px] font-semibold tracking-wider text-slate-400">ENTRADA</span>
            <p class="truncate text-sm font-bold text-slate-900">{{entradaSeleccionada()?.nombre}}</p>
          </div>
          <button (click)="quitarPlato(1)" class="text-red-500 font-bold cursor-pointer">✕</button>
        </div>
      }@else {
    <!-- Estado: Botón Elegir Entrada -->
        <button
          (click)="toggleBuscador(1)"
          class="flex h-12 w-full items-center justify-center rounded-xl border border-dashed border-blue-300 bg-white text-xs font-medium text-blue-600 active:scale-[0.99] transition-transform hover:bg-blue-50/50">
          + Elegir Entrada
        </button>

      }
     </div>


    <!-- Columna 2: FONDO -->
    <div>
      @if (fondoSeleccionado()) {
        <!-- Estado: Fondo Seleccionado -->
        <div class="flex items-center gap-3">
          <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-emerald-200/80 text-emerald-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
          <div class="min-w-0">
            <span class="block text-[10px] font-semibold tracking-wider text-slate-400">FONDO</span>
            <p class="truncate text-sm font-bold text-slate-900">{{ fondoSeleccionado()?.nombre }}</p>
          </div>
          <button (click)="quitarPlato(2)" class="text-red-500 font-bold cursor-pointer">✕</button>
        </div>
      } @else {
        <!-- Estado: Botón Elegir Fondo -->
        <button
          (click)="toggleBuscador(2)"
          class="flex h-12 w-full items-center justify-center rounded-xl border border-dashed border-blue-300 bg-white text-xs font-medium text-blue-600 active:scale-[0.99] transition-transform hover:bg-blue-50/50">
          + Elegir fondo
        </button>
      }
    </div>

  </div>

  <!-- Desplegable del Buscador -->
@if (mostrarBuscador() ) {

    <desplegable
      [categoriaSeleccionada]="categoriaSeleccionada()"
      (oPlatoSelect)="seleccionarPlato($event)"
    />

}
</div>
